<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:transparent;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
  #box{display:flex;gap:10px;align-items:center;background:rgba(8,10,14,.72);
       border-left:4px solid #e0433a;border-radius:10px;padding:12px 16px;color:#fff}
  #tag{font-size:15px;font-weight:700;color:#ff6b5e;letter-spacing:1px;white-space:nowrap}
  #txt{font-size:20px;line-height:1.35;text-shadow:0 2px 6px #000}
  #macro{font-size:14px;color:#8fd6ff;margin-top:4px;font-family:Consolas,monospace}
  #dot{width:9px;height:9px;border-radius:50%;background:#4ade80;flex:none;
       animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}
</style>
</head>
<body>
<div id="box">
  <div id="dot"></div>
  <div id="tag">AI 在玩</div>
  <div>
    <div id="txt">等待中…</div>
    <div id="macro">-</div>
  </div>
</div>
<script>
async function tick(){
  try{
    const r = await fetch('state.json?t=' + Date.now());
    const d = await r.json();
    document.getElementById('txt').textContent = d.thought || '…';
    document.getElementById('macro').textContent = '▶ ' + (d.macro || '-') + '   ' + (d.ts || '');
  }catch(e){}
}
tick(); setInterval(tick, 600);
</script>
</body>
</html>
