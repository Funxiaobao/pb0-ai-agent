# 复制成 config.yaml 再改（config.yaml 含密钥，已被 .gitignore 排除）

# 抓屏：region 填 auto 会在启动时通过 CDP 自动探测云游戏视频区域
capture:
  region: auto
  fps: 30
  model_every: 1.2      # 秒，多久问一次模型（云游戏链路建议 1.2~1.5）
  jpeg_quality: 80
  max_width: 960        # 送给模型的图宽，越小越快

# 输入后端：cdp = 通过 Chrome DevTools 给网页发键鼠事件（网易云游戏网页版推荐）
input:
  backend: cdp
  cdp_url: "http://127.0.0.1:9222"
  page_keyword: "cg.163.com"
  tap_hold: 0.06
  dodge_hold: 0.35
  # 逻辑动作 -> 按键（影之刃零默认键位）
  key_map:
    jump: Space
    light: "mouse:left"
    heavy: f
    dodge: Shift
    parry: "mouse:right"
    lock: "mouse:middle"
    heal: r
    interact: e
    confirm: Enter
    surge: q
  # 方向 -> 移动键
  move_keys:
    forward: w
    back: s
    left: a
    right: d

# 视觉模型，二选一：
#   A. 智谱 GLM-4V-Flash（免费，推荐）：https://open.bigmodel.cn 注册拿 key
#      base_url: "https://open.bigmodel.cn/api/paas/v4"  model: "glm-4v-flash"
#   B. 硅基流动 Qwen3-VL-8B（需充值）：https://cloud.siliconflow.cn
#      base_url: "https://api.siliconflow.cn/v1"  model: "Qwen/Qwen3-VL-8B-Instruct"
policy:
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  model: "glm-4v-flash"
  api_key: "FILL_ME"
  timeout: 10
  max_tokens: 220
  temperature: 0.2
  history_turns: 4

# gamepad 后端才用到（本地游戏 + ViGEmBus 驱动）
controller:
  button_map:
    jump: A
    light: X
    heavy: Y
    dodge: B
    parry: RB
    lock: RS
    heal: LB
    interact: A
    confirm: A
  tap_hold: 0.06
  dodge_hold: 0.35
  stick_gain: 1.0

safety:
  kill_key: f12            # 全局急停
  max_session_minutes: 120
  stuck_window_seconds: 25
  min_hp_guard: false

log:
  dir: logs
  save_frames: false
